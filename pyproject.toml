[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compskill"
version = "0.1.0"
description = "Compiling execution experience for frozen skill retrieval"
requires-python = ">=3.10,<3.13"
dependencies = ["torch>=2.4", "safetensors>=0.4", "numpy>=1.26"]

[project.optional-dependencies]
train = ["sentence-transformers>=3", "huggingface-hub>=0.24", "accelerate>=0.34"]
toolqa = ["openai>=1.50", "sentence-transformers>=3", "transformers>=4.45", "accelerate>=0.34", "bitsandbytes>=0.43"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
